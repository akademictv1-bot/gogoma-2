<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Enviada - Gogoma</title>
    <style>
        :root {
            --primary: #16a34a; /* verde sucesso */
            --bg: #FFFFFF;
            --text: #333333;
        }
        body { 
            font-family: 'Times New Roman', Times, serif;
            font-size: 14pt;
            line-height: 1.6; 
            color: var(--text); 
            max-width: 600px; 
            margin: 100px auto; 
            padding: 40px; 
            text-align: center;
            background-color: var(--bg); 
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 { color: var(--primary); font-size: 2rem; margin-bottom: 0.5rem; }
        p { margin-bottom: 2rem; }
        a { 
            display: inline-block;
            background-color: #1e3c72; 
            color: white; 
            padding: 10px 20px; 
            text-decoration: none; 
            border-radius: 4px;
            font-weight: bold;
        }
        a:hover { background-color: #1e40af; }
    </style>
</head>
<body>
    <div style="font-size: 4rem; color: var(--primary); margin-bottom: 1rem;">✓</div>
    <h1>Mensagem Enviada!</h1>
    <p>Obrigado por contactar a Akademic TV. Recebemos a sua mensagem com sucesso e iremos responder em até 24 horas úteis.</p>
    <a href="/contactos.html">Voltar aos Contactos</a>
</body>
</html>
